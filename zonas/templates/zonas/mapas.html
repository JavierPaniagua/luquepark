<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Mapa de zonas | LuquePark</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <style>
        body {
            background-color: #f4f6f9;
        }

        .page-container {
            max-width: 1000px;
            margin: 25px auto;
        }

        .map-card {
            border: none;
            border-radius: 18px;
            overflow: hidden;
        }

        #mapa {
            width: 100%;
            height: 65vh;
            min-height: 450px;
        }

        .map-header {
            background-color: #0d6efd;
            color: white;
        }
    </style>
</head>

<body>
    <main class="container-fluid px-3">
        <div class="page-container">
            <div class="card map-card shadow">
                <header class="map-header p-3">
                    <div
                        class="d-flex justify-content-between align-items-center"
                    >
                        <div>
                            <h1 class="h3 mb-1">
                                Mapa de zonas
                            </h1>

                            <p class="mb-0">
                                Zonas habilitadas en Luque
                            </p>
                        </div>

                        <a
                            href="{% url 'estacionamientos:activos' %}"
                            class="btn btn-light"
                        >
                            Volver
                        </a>
                    </div>
                </header>

                {% if not zonas %}
                    <div class="alert alert-warning m-3 mb-0">
                        No existen zonas activas con coordenadas
                        registradas.
                    </div>
                {% endif %}

                <div id="mapa"></div>

                <footer class="card-body">
                    <p class="text-muted small mb-0">
                        Presiona un marcador para consultar la zona,
                        tarifa y horario.
                    </p>
                </footer>
            </div>
        </div>
    </main>

    {{ zonas|json_script:"zonas-data" }}

    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    ></script>

    <script>
        const zonas = JSON.parse(
            document.getElementById("zonas-data").textContent
        );

        const centroLuque = [
            -25.2670,
            -57.4870
        ];

        const mapa = L.map("mapa").setView(
            centroLuque,
            14
        );

        L.tileLayer(
            "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
            {
                maxZoom: 19,
                attribution:
                    "&copy; colaboradores de OpenStreetMap"
            }
        ).addTo(mapa);

        function escaparHTML(valor) {
            const elemento = document.createElement("div");
            elemento.textContent = valor ?? "";
            return elemento.innerHTML;
        }

        const marcadores = [];

        zonas.forEach((zona) => {
            const tarifa = Number(
                zona.tarifa_hora
            ).toLocaleString(
                "es-PY",
                {
                    minimumFractionDigits: 0,
                    maximumFractionDigits: 2
                }
            );

            const contenido = `
                <div>
                    <strong>
                        ${escaparHTML(zona.nombre)}
                    </strong>

                    <div>
                        Código: ${escaparHTML(zona.codigo)}
                    </div>

                    <div>
                        Tarifa: Gs. ${tarifa} por hora
                    </div>

                    <div>
                        Horario:
                        ${escaparHTML(zona.hora_inicio)}
                        a
                        ${escaparHTML(zona.hora_fin)}
                    </div>

                    ${
                        zona.descripcion
                            ? `<div class="mt-1">
                                ${escaparHTML(zona.descripcion)}
                               </div>`
                            : ""
                    }
                </div>
            `;

            const marcador = L.marker(
                [
                    zona.latitud,
                    zona.longitud
                ]
            )
                .addTo(mapa)
                .bindPopup(contenido);

            marcadores.push(marcador);
        });

        if (marcadores.length > 0) {
            const grupo = L.featureGroup(
                marcadores
            );

            mapa.fitBounds(
                grupo.getBounds().pad(0.20)
            );
        }
    </script>
</body>
</html>
