{% load static %}

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <meta
        name="description"
        content="LuquePark - Sistema de Estacionamiento Medido de Luque"
    >

    <meta
        name="theme-color"
        content="#002B5C"
    >

    <title>
        {% block title %}
            LuquePark
        {% endblock %}
    </title>

    <!-- Manifest de la PWA -->
    <link
        rel="manifest"
        href="{% static 'pwa/icon.svg' %}?v=3"
    >

    <!-- Icono de LuquePark -->
    <link
        rel="icon"
        href="{% static 'pwa/icon.svg' %}"
        type="image/svg+xml"
    >

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Colores globales azul y oro -->
    <link
        rel="stylesheet"
        href="{% static 'css/luquepark.css' %}"
    >

    <style>
        body {
            min-height: 100vh;
            margin: 0;
        }

        .luquepark-container {
            width: 100%;
            max-width: 1100px;
            margin: 30px auto;
            padding-right: 15px;
            padding-left: 15px;
        }

        .btn-action {
            min-height: 48px;
            font-weight: 600;
        }

        {% block extra_css %}
        {% endblock %}
    </style>

    {% block extra_head %}
    {% endblock %}
</head>

<body>
    {% block content %}
    {% endblock %}

    <!-- Bootstrap JavaScript -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>

    <!-- Registro de la PWA -->
    <script
        src="{% static 'pwa/register.js' %}"
    ></script>

    {% block extra_js %}
    {% endblock %}
</body>
</html>
