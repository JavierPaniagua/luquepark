{% load static %}

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>
        {% block title %}
            LuquePark
        {% endblock %}
    </title>

    <meta
        name="theme-color"
        content="#0d6efd"
    >

    <link
        rel="manifest"
        href="{% static 'pwa/manifest.json' %}"
    >

    <link
        rel="icon"
        href="{% static 'pwa/icon.svg' %}"
        type="image/svg+xml"
    >

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            min-height: 100vh;
            background-color: #f4f6f9;
        }

        .luquepark-container {
            max-width: 1100px;
            margin: 30px auto;
        }

        .btn-action {
            min-height: 48px;
            font-weight: 600;
        }

        {% block extra_css %}
        {% endblock %}
    </style>

    {% block extra_head %}
    {% endblock %}
</head>

<body>
    {% block content %}
    {% endblock %}

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>

    <script
        src="{% static 'pwa/register.js' %}"
    ></script>

    {% block extra_js %}
    {% endblock %}
</body>
</html>
